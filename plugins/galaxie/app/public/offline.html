<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Galaxie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #03030a; color: #ecebf5; font: 15px/1.55 system-ui, 'Segoe UI', sans-serif; }
    body { display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 40%, #1a1538 0%, #03030a 60%); }
    img { width: 96px; height: 96px; opacity: .85; animation: breathe 4s ease-in-out infinite; }
    h1 { font: italic 400 34px/1.2 Georgia, serif; margin: 20px 0 8px; }
    p { color: #a9a7bd; max-width: 440px; margin: 0 auto 6px; }
    code { background: rgba(255,255,255,.07); padding: 2px 7px; border-radius: 6px; color: #ecebf5; }
    .wait { margin-top: 22px; font-size: 13px; color: #6f6c85; }
    @keyframes breathe { 50% { opacity: .5; transform: scale(.96); } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>La Galaxie est endormie</h1>
    <p>Pour la réveiller, double-clique sur l'icône <b>Galaxie</b> du bureau, ou tape <code>/galaxie:ouvrir</code> dans Claude Code.</p>
    <p>Pour qu'elle soit toujours prête, active « Lancer au démarrage de l'ordinateur » dans ⚙ Réglages.</p>
    <p class="wait">Cette page se rechargera toute seule dès qu'elle sera réveillée…</p>
  </main>
  <script>
    setInterval(() => {
      fetch('/api/galaxy', { cache: 'no-store' }).then((r) => { if (r.ok) location.replace('/'); }).catch(() => {});
    }, 3000);
  </script>
</body>
</html>
